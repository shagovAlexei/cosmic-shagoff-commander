[package]
name = "shagoff-commander"
description = "Total Commander-style dual-pane file manager for COSMIC"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
shagoff-core = { path = "../core" }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
log = "0.4"
notify = "8.2"
simple_logger = "5"
tokio = { version = "1", features = ["rt", "time"] }

# Codecs for the viewer (F3), on top of png/jpeg/ico that libcosmic enables.
image = { version = "0.25", default-features = false, features = ["gif", "webp", "bmp"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "ef490df50b0a05a21c494c3f75737581bf0b39d9"
default-features = false
features = ["tokio", "winit", "wayland", "wgpu", "multi-window", "about"]
