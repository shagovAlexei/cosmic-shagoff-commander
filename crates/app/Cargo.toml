[package]
name = "shagoff-commander"
description = "Total Commander-style dual-pane file manager for COSMIC"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
shagoff-core = { path = "../core" }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
log = "0.4"
notify = "8.2"
simple_logger = "5"
tokio = { version = "1", features = ["rt", "time"] }
# Startup probe for the renderer (same versions libcosmic's iced uses; features come from it).
wgpu = { version = "28", default-features = false }
pollster = "0.4"

# Codecs for the viewer (F3), on top of png/jpeg/ico that libcosmic enables.
image = { version = "0.25", default-features = false, features = ["gif", "webp", "bmp"] }

# Built-in terminal (phase 149), adapted from cosmic-term: the emulator and the text it draws with
# (the version libcosmic uses).
alacritty_terminal = "0.25.1"
cosmic-text = { version = "0.19", features = ["monospace_fallback", "shape-run-cache"] }
indexmap = "2"

[dev-dependencies]
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "ef490df50b0a05a21c494c3f75737581bf0b39d9"
default-features = false
features = ["tokio", "winit", "wayland", "wgpu", "multi-window", "about"]

# `just rpm`. Paths: from this crate's dir; target/… from the workspace's target dir.
[package.metadata.generate-rpm]
summary = "Total Commander-style dual-pane file manager for COSMIC"
url = "https://github.com/shagovAlexei/cosmic-shagoff-commander"
assets = [
    { source = "target/release/shagoff-commander", dest = "/usr/bin/shagoff-commander", mode = "755" },
    { source = "../../res/io.github.shagovAlexei.cosmic-shagoff-commander.desktop", dest = "/usr/share/applications/io.github.shagovAlexei.cosmic-shagoff-commander.desktop", mode = "644" },
    { source = "../../res/io.github.shagovAlexei.cosmic-shagoff-commander.metainfo.xml", dest = "/usr/share/metainfo/io.github.shagovAlexei.cosmic-shagoff-commander.metainfo.xml", mode = "644" },
    { source = "../../res/icons/io.github.shagovAlexei.cosmic-shagoff-commander.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.shagovAlexei.cosmic-shagoff-commander.svg", mode = "644" },
    { source = "../../res/apparmor/usr.bin.shagoff-commander", dest = "/usr/share/doc/shagoff-commander/apparmor/usr.bin.shagoff-commander", mode = "644", doc = true },
    { source = "target/man/shagoff-commander.1.gz", dest = "/usr/share/man/man1/shagoff-commander.1.gz", mode = "644", doc = true },
]

# gio (mounts, «Open with»), xdg-open, curl (update check); the libraries come from ldd.
[package.metadata.generate-rpm.requires]
glib2 = "*"
xdg-utils = "*"
curl = "*"

[package.metadata.generate-rpm.recommends]
gvfs = "*"
gvfs-fuse = "*"
