[package]
name = "shagoff-core"
description = "UI-free core of Shagoff Commander: panels, listing, file operations"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bzip2 = "0.6"
flate2 = "1"
jiff = "0.2"
liblzma = { version = "0.4", features = ["static"] }
memchr = "2"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
sevenz-rust2 = "0.23"
similar = { version = "2", default-features = false, features = ["text"] }
tar = "0.4"
trash = "5"
url = "2"
zip = { version = "8", default-features = false, features = ["deflate", "bzip2", "zstd"] }
zstd = "0.14"

[dev-dependencies]
tempfile = "3"
