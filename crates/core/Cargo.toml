[package]
name = "shagoff-core"
description = "UI-free core of Shagoff Commander: panels, listing, file operations"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bzip2 = "0.6"
chardetng = "1.0.0"
encoding_rs = "0.8.42"
flate2 = "1"
jiff = "0.2"
liblzma = { version = "0.4", features = ["static"] }
memchr = "2"
percent-encoding = "2"
mime_guess = "2"
regex = "1"
rustix = { version = "1", features = ["fs", "process", "termios"] }
serde = { version = "1", features = ["derive"] }
sevenz-rust2 = "0.23"
similar = { version = "2", default-features = false, features = ["text"] }
tar = "0.4"
trash = "5"
url = "2"
zbus = "5.19"
zip = { version = "8", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto"] }
zstd = "0.14"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
