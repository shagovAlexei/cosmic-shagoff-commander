# `cargo deny check advisories sources`: known vulnerabilities, and crates only from crates.io and
# the pop-os / iced git repositories libcosmic needs.
[advisories]
# Unmaintained crates only where we depend on them ourselves: the rest come with libcosmic.
unmaintained = "workspace"
ignore = [
    # zip's `extract` helpers: we never call them (archive.rs unpacks entry by entry through
    # `safe_path`, never through a symlink). To go away with the update to zip 9 (ROADMAP 209).
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/iced-rs/cryoglyph",
    "https://github.com/jackpot51/rust-atomicwrites",
    "https://github.com/pop-os/cosmic-protocols",
    "https://github.com/pop-os/dbus-settings-bindings",
    "https://github.com/pop-os/freedesktop-icons",
    "https://github.com/pop-os/libcosmic",
    "https://github.com/pop-os/smithay-clipboard",
    "https://github.com/pop-os/softbuffer",
    "https://github.com/pop-os/window_clipboard",
    "https://github.com/pop-os/winit",
    "https://github.com/wash2/accesskit",
]
