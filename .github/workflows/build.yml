name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The packages, not their install: the runners' Ubuntu mirror is often slow (16 MB took 5
      # minutes). New versions are fetched, the rest come from here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-build-${{ hashFiles('.github/workflows/build.yml') }}

      # libcosmic pulls in the system graphics and Wayland stack; without these
      # the build fails at link time with errors that look unrelated to the code.
      - name: Install system dependencies
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" \
            libxkbcommon-dev \
            libwayland-dev \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libssl-dev \
            pkg-config
          sudo chown -R "$USER" ~/apt-archives # root wrote them; the cache saves as us

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      # libcosmic is a large git dependency; without a cache every run rebuilds
      # the whole tree.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The key follows Cargo.lock and the toolchain, not the profiles: bump it when those
          # change (v1: no debug info for dependencies), else the old cache is restored, does not
          # fit, everything is rebuilt and nothing saved (an exact hit is never saved again).
          prefix-key: v1-rust
          # PR caches are only seen by that PR: main's is the one every PR starts from.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked
