name: release

# Push a tag `vX.Y.Z` (matching `version` in Cargo.toml) → a GitHub release with the .deb and .rpm.
# A PR changing this file builds the .deb only (an artifact, no release). On main (a new version):
# only the build, for its cache — a tag's run sees main's caches, never another tag's, so without it
# every release built everything; tag once this run is done.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['Cargo.toml']
  pull_request:
    paths: ['.github/workflows/release.yml', 'justfile', 'res/*.1']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  deb:
    # The oldest supported Ubuntu (glibc 2.35): the .deb then installs there and on everything
    # newer (Ubuntu 24.04, Pop!_OS 24.04, Mint 21 / 22, Debian 12…). Built on 24.04 it needed 2.39.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The packages, not their install: the runners' Ubuntu mirror is often slow (16 MB took 5
      # minutes). New versions are fetched, the rest come from here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-deb-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Install system dependencies
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" \
            libxkbcommon-dev libwayland-dev libudev-dev libinput-dev libseat-dev \
            libgbm-dev libegl1-mesa-dev libssl-dev pkg-config \
            dpkg-dev
          sudo chown -R "$USER" ~/apt-archives # root wrote them; the cache saves as us

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `just` is not packaged in 22.04.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: just,cargo-generate-rpm

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version in Cargo.toml"; exit 1; }

      - name: Build .deb
        run: just deb

      - name: Build .rpm
        run: just rpm

      - name: Needs at most glibc 2.35
        run: |
          need=$(objdump -T target/release/shagoff-commander | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "needs $need"
          test "$(printf '%s\nGLIBC_2.35\n' "$need" | sort -V | tail -1)" = GLIBC_2.35
          dpkg-deb -f target/deb/*.deb Depends

      # Check a download: `sha256sum -c SHA256SUMS`, or `gh attestation verify FILE --repo shagovAlexei/cosmic-shagoff-commander`.
      - name: Checksums
        run: |
          (cd target/deb && sha256sum *.deb) > SHA256SUMS
          (cd target/generate-rpm && sha256sum *.rpm) >> SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/deb/*.deb
            target/generate-rpm/*.rpm

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### SHA-256'; echo '```'; cat SHA256SUMS; echo '```'; } > sums.md
          gh release create "$GITHUB_REF_NAME" target/deb/*.deb target/generate-rpm/*.rpm SHA256SUMS --generate-notes --notes-file sums.md

      # Keep the five newest releases; older ones go, tags with them.
      - name: Prune old releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[5:][].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: packages
          path: |
            target/deb/*.deb
            target/generate-rpm/*.rpm
