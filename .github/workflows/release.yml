name: release

# Push a tag `vX.Y.Z` (matching `version` in Cargo.toml) → a GitHub release with the .deb attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    # Same Ubuntu base (glibc 2.39) as Pop!_OS 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libudev-dev libinput-dev libseat-dev \
            libgbm-dev libegl1-mesa-dev libssl-dev pkg-config \
            just dpkg-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build .deb
        run: just deb

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/deb/*.deb --generate-notes
