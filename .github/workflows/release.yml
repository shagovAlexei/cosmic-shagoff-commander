name: release

# Push a tag `vX.Y.Z` (matching `version` in Cargo.toml) → a GitHub release with the .deb and .rpm.
# A PR changing this file builds the .deb only (an artifact, no release).
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'justfile', 'res/*.1']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  deb:
    # The oldest supported Ubuntu (glibc 2.35): the .deb then installs there and on everything
    # newer (Ubuntu 24.04, Pop!_OS 24.04, Mint 21 / 22, Debian 12…). Built on 24.04 it needed 2.39.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libudev-dev libinput-dev libseat-dev \
            libgbm-dev libegl1-mesa-dev libssl-dev pkg-config \
            dpkg-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # `just` is not packaged in 22.04.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: just,cargo-generate-rpm

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version in Cargo.toml"; exit 1; }

      - name: Build .deb
        run: just deb

      - name: Build .rpm
        run: just rpm

      - name: Needs at most glibc 2.35
        run: |
          need=$(objdump -T target/release/shagoff-commander | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "needs $need"
          test "$(printf '%s\nGLIBC_2.35\n' "$need" | sort -V | tail -1)" = GLIBC_2.35
          dpkg-deb -f target/deb/*.deb Depends

      # Check a download: `sha256sum -c SHA256SUMS`, or `gh attestation verify FILE --repo shagovAlexei/cosmic-shagoff-commander`.
      - name: Checksums
        run: |
          (cd target/deb && sha256sum *.deb) > SHA256SUMS
          (cd target/generate-rpm && sha256sum *.rpm) >> SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/deb/*.deb
            target/generate-rpm/*.rpm

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/deb/*.deb target/generate-rpm/*.rpm SHA256SUMS --generate-notes

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request'
        with:
          name: packages
          path: |
            target/deb/*.deb
            target/generate-rpm/*.rpm
