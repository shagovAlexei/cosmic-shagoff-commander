name: audit

# Known vulnerabilities and unexpected sources in the dependency tree: when the lock file changes,
# and weekly (an advisory appears without any change of ours).
on:
  push:
    branches: [main]
    paths: ['Cargo.lock', 'deny.toml']
  pull_request:
    paths: ['Cargo.lock', 'deny.toml', '.github/workflows/audit.yml']
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories sources
